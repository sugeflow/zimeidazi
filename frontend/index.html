<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 子路径代理下必须带结尾斜杠，否则相对资源路径(./assets)会解析到上一级 → 404 白屏。
      // 若当前路径无结尾斜杠且末段不像文件名(无扩展名)，自动补斜杠后重载。
      (function () {
        var p = location.pathname;
        var last = p.split('/').pop();
        if (p && !p.endsWith('/') && !/\.[a-z0-9]+$/i.test(last)) {
          location.replace(p + '/' + location.search + location.hash);
        }
      })();
    </script>
    <script>
      // 首帧之前确定主题，避免浅色闪一下再变深色。与 src/lib/theme.ts 保持一致
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('dz-theme') || 'system'; } catch (e) {}
        var dark = (pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <link rel="icon" type="image/png" href="/src/assets/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>自媒搭子</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
