<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自媒搭子</title>
  <style>
    :root {
      --bg: #faf7f2; --fg: #1f1d1a; --muted: #7a746b; --accent: #e8573a; --card: #ffffff; --line: #ece6dc;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171614; --fg: #f1ede6; --muted: #a39c91; --accent: #ff7a5c; --card: #211f1c; --line: #2f2c28; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      display: grid; place-items: center;
    }
    main { text-align: center; padding: 24px; }
    .logo {
      width: 88px; height: 88px; margin: 0 auto 20px; border-radius: 22px;
      background: var(--accent); color: #fff; display: grid; place-items: center;
      font-size: 48px; font-weight: 700;
    }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 2px; }
    p { margin: 0; color: var(--muted); }
    .card {
      margin-top: 28px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 12px;
      background: var(--card); color: var(--muted); font-size: 13px; display: inline-block;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">搭</div>
    <h1>自媒搭子</h1>
    <p>你的自媒体创作搭子 · 准备中</p>
    <div class="card" id="info">正在读取版本信息…</div>
  </main>
  <script>
    const info = document.getElementById('info');
    const invoke = window.__TAURI__?.core?.invoke;
    if (invoke) {
      invoke('app_info').then(i => { info.textContent = `v${i.version} · ${i.os}-${i.arch}`; })
        .catch(e => { info.textContent = '读取失败：' + e; });
    } else {
      info.textContent = '在浏览器中预览（非桌面环境）';
    }
  </script>
</body>
</html>
