name: 构建运行时包

# 运行时包（Python + 依赖、Node + OpenClaw、FFmpeg、Chromium）和安装包解耦：
# 只有依赖或上游代码变化时才需要重建。每次都会用它把 Easel 完整跑一遍（冒烟测试）。
on:
  push:
    branches: [main]
    paths:
      - runtime/**
      - scripts/stage_easel.py
      - patches/**
      - upstream/**
      - .github/workflows/runtime.yml
  pull_request:
    paths:
      - runtime/**
      - scripts/stage_easel.py
      - patches/**
      - upstream/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            os: windows-latest
          - platform: mac-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v10.2.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 下载缓存
        uses: actions/cache@v6
        with:
          path: build/runtime/cache
          key: runtime-dl-${{ matrix.platform }}-${{ hashFiles('runtime/versions.json') }}

      - run: python -m pip install zstandard

      - name: 构建运行时包
        run: python runtime/build_runtime.py --platform ${{ matrix.platform }}

      - name: 整理 Easel 代码
        run: python scripts/stage_easel.py

      - name: 冒烟测试
        run: >-
          python runtime/smoke_test.py
          --runtime build/runtime/stage/runtime
          --browsers build/runtime/stage/browsers
          --app build/easel

      - name: 上传运行时包
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.platform }}
          path: |
            build/runtime/*.tar.zst
            build/runtime/manifest-*.json
          retention-days: 14
          compression-level: 0

      # 过渡方案：放到 GitHub Release 供桌面壳下载（M5 改为国内 OSS）。
      # 已发布的运行时包不可变：同一个 runtime_version 只发布一次，绝不覆盖——覆盖（先删后传）
      # 期间正在下载的用户会拿到 404。运行时有变化时，在 runtime/versions.json 里把 runtime_version 加一。
      - name: 发布运行时包（仅首次）
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "import json;print(json.load(open('runtime/versions.json'))['runtime_version'])")
          TAG="runtime-r$V"
          if gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "manifest-${{ matrix.platform }}.json"; then
            echo "$TAG 的 ${{ matrix.platform }} 运行时包已经发布过，不覆盖"
            exit 0
          fi
          gh release create "$TAG" --prerelease --title "运行时包 r$V" \
            --notes "桌面壳首次启动时下载的运行时包和浏览器包。发布后不再修改。" 2>/dev/null || true
          gh release upload "$TAG" build/runtime/*.tar.zst build/runtime/manifest-${{ matrix.platform }}.json
